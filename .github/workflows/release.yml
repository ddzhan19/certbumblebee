name: Release

# Startet, wenn ein Tag wie v1.2.0 hochgeladen wird. Der Tag muss zu appVersion in version.go passen.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tag und Version vergleichen
        run: |
          v=$(sed -n 's/.*appVersion *= *"\(.*\)".*/\1/p' version.go)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Der Tag $GITHUB_REF_NAME passt nicht zu appVersion $v in version.go."
            exit 1
          fi
      - name: Tests
        run: go test -count=1 .
      - name: Windows-EXE bauen
        run: |
          mkdir dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/certbumblebee.exe .
          cd dist && sha256sum certbumblebee.exe > certbumblebee.exe.sha256
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/certbumblebee.exe dist/certbumblebee.exe.sha256 \
            --title "Certbumblebee $GITHUB_REF_NAME" --generate-notes
